spring.application.name=ms-usuarios-auth
server.port=9091

spring.datasource.url=jdbc:mysql://localhost:3306/usuarios_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.jwt.secret=JuraTempestArcadeHub
app.jwt.expiration-minutes=120

logging.level.com.juratempest.ms_usuarios_auth=INFO
