# Configuración de la aplicación y la base de datos para el microservicio de horarios
spring.application.name=ms-horarios
server.port=9093

#Creacion de la base de datos horarios_db si no existe, sin SSL y con zona horaria de Santiago
spring.datasource.url=jdbc:mysql://localhost:3306/horarios_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

#Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Liquibase para gestionar cambios en la base de datos
spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql

#Configuracion de Eureka para el descubrimiento de servicios
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

#Configuracion de logging para el paquete del microservicio
logging.level.com.juratempest.ms_horarios=INFO

app.jwt.secret=${JWT_SECRET:JuraTempestArcadeHub}
