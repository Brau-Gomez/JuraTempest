server:
  port: 9090
  address: 0.0.0.0

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-usuarios-auth
              uri: lb://ms-usuarios-auth
              predicates:
                - Path=/auth/**,/users/**

            - id: ms-maquinas
              uri: lb://ms-maquinas
              predicates:
                - Path=/maquinas/**

            - id: ms-horarios
              uri: lb://ms-horarios
              predicates:
                - Path=/horarios/**

            - id: ms-reservas
              uri: lb://ms-reservas
              predicates:
                - Path=/reservas/**

            - id: ms-fidelizacion
              uri: lb://ms-fidelizacion
              predicates:
                - Path=/fidelizacion/**

            - id: ms-notificaciones
              uri: lb://ms-notificaciones
              predicates:
                - Path=/notificaciones/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:JuraTempestArcadeHub}
