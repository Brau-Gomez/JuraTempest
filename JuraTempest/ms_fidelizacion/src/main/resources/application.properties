spring.application.name=ms-fidelizacion
server.port=9095

spring.datasource.url=jdbc:mysql://localhost:3306/fidelizacion_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#Servidor eureka para cambiar nombre a URL de 'localhost:9095 -> http:ms-fidelizacion/**' con el fin de que quede mas legible el codigo.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

logging.level.com.juratempest.ms_fidelizacion=INFO