x-common-env: &common-env
  EUREKA_HOST: eureka-server
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: admin123
  JWT_SECRET: JuraTempestArcadeHub

services:

  mysql:
    image: mysql:8.4
    container_name: juratempest-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
    volumes:
      - juratempest_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  eureka-server:
    build: ./eureka_server
    container_name: eureka-server
    ports:
      - "8761:8761"

  ms-usuarios:
    build: ./ms_usuarios
    container_name: ms-usuarios
    ports:
      - "9091:9091"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/usuarios_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-auth:
    build: ./ms_auth
    container_name: ms-auth
    ports:
      - "9101:9101"
    environment:
      <<: *common-env
      EUREKA_HOST: eureka-server
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      APP_JWT_SECRET: JuraTempestArcadeHub
      APP_JWT_EXPIRATION_MINUTES: 120
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-usuarios:
        condition: service_started

  ms-maquinas:
    build: ./ms_maquinas
    container_name: ms-maquinas
    ports:
      - "9092:9092"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/maquinas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started

  ms-horarios:
    build: ./ms-horarios
    container_name: ms-horarios
    ports:
      - "9093:9093"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/horarios_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started

  ms-reservas:
    build: ./ms_reservas
    container_name: ms-reservas
    ports:
      - "9094:9094"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reservas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-usuarios:
        condition: service_started
      ms-maquinas:
        condition: service_started
      ms-horarios:
        condition: service_started
      ms-auth:
        condition: service_started

  ms-fidelizacion:
    build: ./ms_fidelizacion
    container_name: ms-fidelizacion
    ports:
      - "9095:9095"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fidelizacion_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-usuarios:
        condition: service_started
      ms-auth:
        condition: service_started

  ms-notificaciones:
    build: ./ms_notificaciones
    container_name: ms-notificaciones
    ports:
      - "9096:9096"
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notificaciones_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-usuarios:
        condition: service_started
      ms-auth:
        condition: service_started

  ms-pagos:
    build: ./ms_pagos
    container_name: ms-pagos
    ports:
      - "9097:9097"
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pagos_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-reservas:
        condition: service_started
      ms-maquinas:
        condition: service_started
      ms-fidelizacion:
        condition: service_started
      ms-notificaciones:
        condition: service_started
      ms-promociones:
        condition: service_started
      ms-auth:
        condition: service_started

  ms-promociones:
    build: ./ms_promociones
    container_name: ms-promociones
    ports:
      - "9098:9098"
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/promociones_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started

  ms-mantenimiento:
    build: ./ms_mantenimiento
    container_name: ms-mantenimiento
    ports:
      - "9099:9099"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mantenimiento_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-maquinas:
        condition: service_started
      ms-usuarios:
        condition: service_started
      ms-notificaciones:
        condition: service_started
      ms-auth:
        condition: service_started

  ms-eventos-torneos:
    build: ./ms_eventos_torneos
    container_name: ms-eventos-torneos
    ports:
      - "9100:9100"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eventos_torneos_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      ms-auth:
        condition: service_started
      ms-usuarios:
        condition: service_started
      ms-maquinas:
        condition: service_started
      ms-horarios:
        condition: service_started
      ms-fidelizacion:
        condition: service_started
      ms-notificaciones:
        condition: service_started


  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9090:9090"
    environment:
      EUREKA_HOST: eureka-server
      JWT_SECRET: JuraTempestArcadeHub
    depends_on:
      - eureka-server
      - ms-auth
      - ms-usuarios
      - ms-maquinas
      - ms-horarios
      - ms-reservas
      - ms-fidelizacion
      - ms-notificaciones
      - ms-pagos
      - ms-promociones
      - ms-mantenimiento
      - ms-eventos-torneos

volumes:
  juratempest_mysql_data:
