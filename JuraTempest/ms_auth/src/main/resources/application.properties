spring.application.name=ms-auth
server.port=9101

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog.sql

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.jwt.secret=${APP_JWT_SECRET:JuraTempestArcadeHub}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}

springdoc.swagger-ui.path=/doc/swagger-ui.html

logging.level.com.juratempest.ms_auth=INFO
