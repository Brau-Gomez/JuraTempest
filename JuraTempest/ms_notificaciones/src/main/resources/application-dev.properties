# Perfil de desarrollo: activa DataLoader y permite configurar MySQL por variables de entorno.

# MySQL
# Nota: usar una base de datos claramente aislada para el perfil dev.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/notificaciones_db_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
# Por defecto usamos "update" para evitar drops accidentales en entornos donde se active el perfil dev por error.
# Si se necesita un comportamiento destructivo (create-drop), se debe configurar explícitamente SPRING_JPA_HIBERNATE_DDL_AUTO.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.juratempest.ms_notificaciones=DEBUG
